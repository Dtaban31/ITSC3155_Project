{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Event Page</title>
    <link rel="stylesheet" href="{% static 'base/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body#new_event_page {
            background-color: #1e1e1e;
            color: #616161;
            font-family: 'Inter', sans-serif;
        }

        header {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-button {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.3s ease;
            background-color: #4caf50;
            color: #6e6e6e;
        }

        .nav-button:hover {
            background-color: #43a047;
        }

        main {
            background-color: #2e2e2e;
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #90ee90;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #dddddd;
        }
    </style>
</head>
<body id="new_event_page">
    <div class="container">
        <header>
            <h1>Welcome to <span style="color: #90ee90;">OrgFinder</span></h1>
            <nav>
                <a href="{% url 'home' %}" class="nav-button">Home</a>
            </nav>
        </header>
        <main>
            <h2>Welcome to the New Event Page!</h2>
            <p>Explore upcoming events, learn more about organizations, or start your own!</p>
        </main>
    </div>
</body>
</html>
