{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OrgFinder</title>
    <link rel="stylesheet" href="{% static 'base/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        header {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-button {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.3s ease;
        }

        .signup-btn {
            background-color: #4caf50;
            color: #fff;
        }

        .signup-btn:hover {
            background-color: #43a047;
        }

        .home-btn {
            background-color: #2196f3;
            color: #fff;
        }

        .home-btn:hover {
            background-color: #1976d2;
        }

        main {
            background-color: #2e2e2e;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px;
            background-color: #90ee90;
            color: #1e1e1e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #76d976;
        }

        .error-messages {
            margin-top: 15px;
            color: #ff4d4d;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Login to <span style="color: #90ee90;">OrgFinder</span></h1>
            <nav>
                <a href="{% url 'signup' %}" class="nav-button signup-btn">Sign Up</a>
                <a href="{% url 'home' %}" class="nav-button home-btn">Home</a>
            </nav>
        </header>
        <main>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log In</button>
            </form>
            {% if form.errors %}
                <div class="error-messages">
                    <ul>
                        {% for field in form %}
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        </main>
    </div>
</body>
</html>
