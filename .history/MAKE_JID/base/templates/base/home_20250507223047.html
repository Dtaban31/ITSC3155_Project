{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgFinder - Home</title>
    <link rel="stylesheet" href="{% static 'base/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body#home-page {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        #home-page header {
            background-color: #2c2c2c;
        }

        #home-page nav a {
            color: #ffffff;
        }

        #home-page main {
            background-color: #2e2e2e;
        }

        #home-page h2 {
            color: #90ee90;
        }

        #home-page p {
            color: #dddddd;
        }

        #home-page button {
            background-color: #90ee90;
            color: #1e1e1e;
            font-weight: bold;
        }

        #home-page button:hover {
            background-color: #76d976;
        }
    </style>
</head>

<body id="home-page">
    <div class="container">
        <header>
            <h1>Welcome to <span style="color: #90ee90;">OrgFinder</span></h1>
            <nav>
                <a href="{% url 'signup' %}">Sign Up</a>
                <a href="{% url 'login' %}">Login</a>
            </nav>
        </header>

        <main>
            <h2>Your Gateway to Campus Organizations</h2>
            <p style="font-size: 1.1em; line-height: 1.6;">
                Whether you're looking to join a club, start an event, or simply explore, OrgFinder is your centralized hub. 
                Sign up or log in to discover and create events with ease.
            </p>

            <div style="margin-top: 30px;">
                <a href="{% url 'create_event' %}">
                    <button style="
                        border: none;
                        padding: 12px 28px;
                        border-radius: 8px;
                        font-size: 16px;
                        cursor: pointer;
                        transition: background-color 0.3s ease;
                    ">
                        Create an Event
                    </button>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
