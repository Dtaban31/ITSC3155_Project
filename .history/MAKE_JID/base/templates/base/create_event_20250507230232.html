<!-- base/templates/base/create_event.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Event</title>
    <link rel="stylesheet" href="{% static 'base/style.css' %}">
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            background-color: #4caf50;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #43a047;
        }

        main {
            background-color: #2e2e2e;
            margin-top: 30px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px;
            background-color: #90ee90;
            color: #1e1e1e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #76d976;
        }

        .helptext {
            display: block;
            margin-top: 4px;
            color: #cccccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Create a New Event</h1>
            <nav>
                <a href="/">Home</a>
                <a href="{% url 'new_event_page' %}">Create Event</a>
            </nav>
        </header>
        <main>
            <h2>Create Event</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Submit</button>
            </form>
        </main>
    </div>
</body>
</html>
